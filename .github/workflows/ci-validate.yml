name: Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize bootstrap without a backend
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=terraform/bootstrap validate

      - name: Initialize workload without a backend
        run: terraform -chdir=terraform/workloads/helloworld init -backend=false -input=false

      - name: Validate workload
        run: terraform -chdir=terraform/workloads/helloworld validate

      - name: Run Infracost cost estimation
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost report
        run: |
          terraform -chdir=terraform/workloads/helloworld init -backend=false -input=false
          terraform -chdir=terraform/workloads/helloworld plan -input=false -out=tfplan
          infracost breakdown --path terraform/workloads/helloworld/tfplan \
            --format json \
            --out-file infracost.json

      - name: Comment Infracost estimate on PR
        run: |
          infracost comment github --path infracost.json \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --commit "${{ github.sha }}"

      - name: Build container image
        run: docker build --file app/Dockerfile --tag helloworld:validation app
