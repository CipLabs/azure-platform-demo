name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - "terraform/workloads/helloworld/**"
      - "app/**"
      - ".github/workflows/cd-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: helloworld-prod-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"
          docker build --tag "$ACR_NAME.azurecr.io/helloworld:${{ github.sha }}" app
          docker push "$ACR_NAME.azurecr.io/helloworld:${{ github.sha }}"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Scan image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ vars.ACR_NAME }}.azurecr.io/helloworld:${{ github.sha }}
          args: --severity-threshold=critical

      - name: Initialize remote backend
        run: |
          terraform -chdir=terraform/workloads/helloworld init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=helloworld-prod.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
        shell: bash

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate workload
        run: terraform -chdir=terraform/workloads/helloworld validate

      - name: Create deployment plan
        run: |
          terraform -chdir=terraform/workloads/helloworld plan \
            -input=false \
            -out=tfplan \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="container_registry_name=${ACR_NAME}" \
            -var="image_tag=${GITHUB_SHA}"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/workloads/helloworld/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Download terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/workloads/helloworld/

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote backend
        run: |
          terraform -chdir=terraform/workloads/helloworld init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=helloworld-prod.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
        shell: bash

      - name: Apply reviewed plan
        run: terraform -chdir=terraform/workloads/helloworld apply -input=false -auto-approve tfplan
        shell: bash
